    html { min-height: 100%; background: var(--bg); scroll-behavior: smooth; }
    body {

      background-size: 42px 42px;
      mask-image: radial-gradient(ellipse at center, #000 18%, transparent 82%);

    .scanlines {
      z-index: 4; opacity: .10;
      background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(0,0,0,.7) 4px);
    }
    .ambient {
      z-index: -1; inset: auto; width: 520px; height: 520px; top: 18%; left: 50%;
      transform: translateX(-50%); border-radius: 50%;
      background: rgba(255,255,255,.065); filter: blur(125px);

    .page-shell {
      min-height: 100svh; display: grid; place-items: center; padding: 32px 16px 44px;
      position: relative; z-index: 1;
    }
    .profile-card {
      width: min(100%, 460px); position: relative; overflow: hidden;
      padding: clamp(22px, 5vw, 34px); border-radius: 28px;
      border: 1px solid rgba(255,255,255,.18);
      background: linear-gradient(145deg, rgba(17,17,21,.91), rgba(5,5,7,.91) 58%, rgba(13,13,16,.88));
      box-shadow: 0 30px 90px rgba(0,0,0,.78), 0 0 42px rgba(255,255,255,.055), inset 0 1px rgba(255,255,255,.16);
      backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      transform-style: preserve-3d;
      transition: border-color .35s ease, box-shadow .35s ease, transform .18s ease-out;
      animation: cardEnter .8s var(--ease) both, floatCard 7s ease-in-out 1s infinite;

    .profile-card::before {
      content: ""; position: absolute; inset: 0 0 auto; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.8), transparent); opacity: .7;

    .profile-card:hover {

    }
    .status-bar {
      display:flex; justify-content:space-between; align-items:center; gap:12px;
      border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:16px; margin-bottom:27px;
      color:#c4c4cb; font:700 11px Rajdhani,sans-serif; letter-spacing:.15em;
    }
    .online-dot { width:8px; height:8px; border-radius:50%; display:inline-block; background:#fff; box-shadow:0 0 12px #fff; position:relative; }

    .version { padding:6px 9px; border:1px solid rgba(255,255,255,.13); background:rgba(255,255,255,.045); border-radius:7px; color:#ddd; font:10px Orbitron,sans-serif; letter-spacing:.08em; }
    .avatar-wrap { width:142px; height:142px; margin:0 auto 23px; position:relative; cursor:pointer; }

      transition:opacity .3s ease, filter .3s ease;

    .avatar-wrap:hover .avatar-aura { opacity:.9; filter:blur(15px); }
    .avatar-ring {
      position:absolute; inset:-3px; border-radius:50%; padding:3px;

    .avatar-frame { position:relative; width:100%; height:100%; padding:4px; border-radius:50%; background:#050505; border:1px solid rgba(255,255,255,.5); overflow:hidden; }

    .beta-chip {

    .title-glitch {

    .title-glitch::before, .title-glitch::after {
      content:attr(data-text); position:absolute; inset:0; pointer-events:none; opacity:0;

    .footer-line { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-top:23px; padding-top:15px; border-top:1px solid rgba(255,255,255,.09); color:#777780; font:600 10px Rajdhani,sans-serif; letter-spacing:.09em; }
    #toast {
      position:fixed; z-index:20; bottom:max(20px,env(safe-area-inset-bottom)); left:50%;

    .toast-dot { width:7px; height:7px; border-radius:50%; background:#111; box-shadow:0 0 0 3px #ddd; }
    #intro {

    @keyframes introFailsafe { to { opacity:0; visibility:hidden; pointer-events:none; } }

    .intro-inner { width:min(390px,100%); text-align:center; }
    .intro-mark { font:900 clamp(24px,7vw,34px) Orbitron,sans-serif; letter-spacing:.12em; text-shadow:0 0 25px rgba(255,255,255,.4); }
    .intro-caption { margin-top:14px; color:#a5a5ad; font:700 10px Rajdhani,sans-serif; letter-spacing:.22em; }
    .progress-track { height:3px; margin-top:25px; border-radius:5px; background:#25252a; overflow:hidden; }
    .progress-fill { height:100%; width:0; background:#fff; box-shadow:0 0 15px #fff; animation:loadProgress 1.25s ease-out forwards; }
    .skip-intro { margin-top:19px; padding:8px 12px; color:#777; font:700 9px Orbitron,sans-serif; letter-spacing:.1em; background:transparent; border:0; cursor:pointer; }
    .system-time { font-variant-numeric:tabular-nums; }
    .burst { position:fixed; width:6px; height:6px; border-radius:50%; pointer-events:none; z-index:15; background:#fff; box-shadow:0 0 14px #fff; animation:burst .65s ease-out forwards; }
    @keyframes cardEnter { from { opacity:0; transform:translateY(18px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes floatCard { 0%,100% { translate:0 0; } 50% { translate:0 -4px; } }
    @keyframes rotate { to { transform:rotate(360deg); } }
    @keyframes ping { 0% { transform:scale(.6); opacity:.85; } 100% { transform:scale(1.8); opacity:0; } }
    @keyframes loadProgress { 0% { width:0; } 100% { width:100%; } }
    @keyframes glitchA { 0%,100% { clip-path:inset(10% 0 70% 0); } 50% { clip-path:inset(48% 0 30% 0); } }
    @keyframes glitchB { 0%,100% { clip-path:inset(65% 0 12% 0); } 50% { clip-path:inset(20% 0 58% 0); } }
    @keyframes burst { to { transform:translate(var(--dx),var(--dy)) scale(0); opacity:0; } }
    @media (max-width:520px) {

      .avatar-wrap { width:128px; height:128px; }

      .social-icon { width:41px; height:41px; flex-basis:41px; }
      .social-name { font-size:12px; }
      .footer-line { font-size:9px; }
    }
    @media (hover:none) {
      .profile-card:hover, .social-link:hover, .bio-box:hover { transform:none; }
      .social-link:hover { box-shadow:none; }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; transition-duration:.01ms !important; }
      #starCanvas, #fxCanvas { display:none; }
    }
  </style>
</head>
