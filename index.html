            darkMode: 'class',

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #e5e5e5;
            overflow-x: hidden;
            min-height: 100vh;
            perspective: 1200px;
        }

        /* Mono CRT Scanline Overlay */
        .crt-overlay {
            background: linear-gradient(
                rgba(18, 18, 18, 0) 50%, 
                rgba(0, 0, 0, 0.6) 50%
            );
            background-size: 100% 4px;
        }

        /* Mono Grid */
        .mono-grid {
            background-size: 32px 32px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        /* Monochromatic Glitch Text Effect */
        .mono-glitch {
            position: relative;
            display: inline-block;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .mono-glitch::before, .mono-glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip: rect(0, 0, 0, 0);
        }

        .mono-glitch:hover::before {
            left: -2px;
            text-shadow: 2px 0 #ffffff;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim 0.3s infinite linear alternate-reverse;
        }

        .mono-glitch:hover::after {
            left: 2px;
            text-shadow: -2px 0 #888888;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim2 0.3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(12px, 9999px, 44px, 0); }
            20% { clip: rect(38px, 9999px, 88px, 0); }
            40% { clip: rect(2px, 9999px, 12px, 0); }
            60% { clip: rect(60px, 9999px, 75px, 0); }
            80% { clip: rect(22px, 9999px, 30px, 0); }
            100% { clip: rect(50px, 9999px, 95px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(40px, 9999px, 15px, 0); }
            20% { clip: rect(65px, 9999px, 35px, 0); }
            40% { clip: rect(10px, 9999px, 80px, 0); }
            60% { clip: rect(85px, 9999px, 10px, 0); }
            80% { clip: rect(30px, 9999px, 55px, 0); }
            100% { clip: rect(15px, 9999px, 70px, 0); }
        }

        /* Glassmorphic Dark Card */
        .glass-dark-card {
            background: rgba(8, 8, 10, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 
                0 30px 60px -12px rgba(0, 0, 0, 0.95),
                0 0 30px rgba(255, 255, 255, 0.05),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
            transform-style: preserve-3d;
            will-change: transform;
            transition: transform 0.15s ease-out, box-shadow 0.3s ease;
        }

        .glass-dark-card:hover {
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 
                0 35px 70px -15px rgba(0, 0, 0, 1),
                0 0 40px rgba(255, 255, 255, 0.12),
                inset 0 1px 2px rgba(255, 255, 255, 0.3);
        }

        /* Mono Dynamic Buttons */
        .mono-btn {
            position: relative;
            background: rgba(15, 15, 18, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            overflow: hidden;
            will-change: transform;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .mono-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.6s ease;
        }

        .mono-btn:hover::before {
            left: 100%;
        }

        .mono-btn:hover {
            background: rgba(25, 25, 30, 0.9);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 255, 255, 0.15);
        }

        /* Audio Equalizer Bars */
        .eq-bar {
            width: 3px;
            background: #ffffff;
            border-radius: 2px;
            animation: eqAnim 0.8s ease-in-out infinite alternate;
        }
        .eq-bar:nth-child(1) { height: 50%; animation-delay: 0.1s; }
        .eq-bar:nth-child(2) { height: 100%; animation-delay: 0.3s; }
        .eq-bar:nth-child(3) { height: 30%; animation-delay: 0.2s; }
        .eq-bar:nth-child(4) { height: 80%; animation-delay: 0.4s; }

        @keyframes eqAnim {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1); }
        }

        /* Toast Alert */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: #ffffff;
            color: #000000;
            padding: 12px 26px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.9rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
            pointer-events: none;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
