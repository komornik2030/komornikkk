<html lang="pl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOMORNIK | Official Cyber Hub 2000+</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&family=Rajdhani:wght@500;600;700;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           ULTIMATE HEAVYWEIGHT CSS CORE ENGINE v5.0 (2000+ LINES EDITION)
           DEVELOPED FOR KOMORNIK - DARK NEON HIGH PERFORMANCE SUITE
           ========================================================================== */

        :root {
            --bg-deep-space: #010103;
            --bg-card-glass: rgba(6, 6, 10, 0.88);
            --border-neon-white: rgba(255, 255, 255, 0.18);
            --border-neon-bright: rgba(255, 255, 255, 0.65);
            --neon-glow-primary: rgba(255, 255, 255, 0.4);
            --discord-blurple: #5865F2;
            --discord-dark: #2f3136;
            --discord-glow: rgba(88, 101, 242, 0.65);
            --tiktok-pink: #ff0050;
            --tiktok-cyan: #00f2fe;
            --youtube-red: #ff0000;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --text-muted: #64748b;
            --accent-green: #23a55a;
        }

        /* --------------------------------------------------------------------------
           SECTION 1: GLOBAL RESET AND BASE CANVAS STYLES
           -------------------------------------------------------------------------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: var(--bg-deep-space);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            position: relative;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Interactive WebGL/2D Canvas Background Layer */
        #heavyCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Cyberpunk Grid Atmosphere Effect */
        .cyber-grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 45px 45px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.6;
        }

        /* --------------------------------------------------------------------------
           SECTION 2: MAIN CONTAINER GLASSMORPHISM ARCHITECTURE
           -------------------------------------------------------------------------- */
        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            background: var(--bg-card-glass);
            border: 1px solid var(--border-neon-white);
            border-radius: 36px;
            padding: 45px 28px;
            text-align: center;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.95),
                        0 0 45px rgba(255, 255, 255, 0.05),
                        inset 0 0 30px rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            animation: mainCardEntry 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform: translateY(40px);
            opacity: 0;
        }

        @keyframes mainCardEntry {
            0% {
                transform: translateY(40px) scale(0.96);
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        /* --------------------------------------------------------------------------
           SECTION 3: AVATAR LIGHTSABER PHOTO SYSTEM
           -------------------------------------------------------------------------- */
        .avatar-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 25px auto;
        }

        .avatar-glow-ring {
            position: absolute;
            inset: -6px;
            background: linear-gradient(135deg, #ffffff, var(--discord-blurple), var(--tiktok-pink), #ffffff);
            border-radius: 50%;
            z-index: 1;
            filter: blur(12px);
            opacity: 0.85;
            animation: rotateAvatarRing 9s linear infinite;
        }

        @keyframes rotateAvatarRing {
            0% { filter: blur(12px) hue-rotate(0deg); }
            100% { filter: blur(12px) hue-rotate(360deg); }
        }

        .avatar-frame {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #000000;
            overflow: hidden;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.9);
            background: #09090d;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.5s ease;
        }

        .avatar-frame:hover .avatar-img {
            transform: scale(1.1);
        }

        /* Online Green Pulsing Indicator */
        .online-dot {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 22px;
            height: 22px;
            background-color: var(--accent-green);
            border: 3.5px solid #000000;
            border-radius: 50%;
            z-index: 5;
            animation: pulseOnline 2.2s infinite;
        }

        @keyframes pulseOnline {
            0% { box-shadow: 0 0 0 0 rgba(35, 165, 90, 0.9); }
            70% { box-shadow: 0 0 0 12px rgba(35, 165, 90, 0); }
            100% { box-shadow: 0 0 0 0 rgba(35, 165, 90, 0); }
        }

        /* --------------------------------------------------------------------------
           SECTION 4: GLITCH & NEON TITLES
           -------------------------------------------------------------------------- */
        .profile-name {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 8px;
            background: linear-gradient(180deg, #ffffff 30%, #777777 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
            position: relative;
        }

        .cyber-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 22px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Requested Bio Box: "Hi i'm komornik im from Poland Play CF TWW" */
        .bio-card {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 20px;
            padding: 16px 20px;
            font-size: 0.98rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 28px;
            font-weight: 400;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .bio-card strong {
            color: #ffffff;
            font-weight: 700;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        /* --------------------------------------------------------------------------
           SECTION 5: ACTION BUTTONS & SOCIAL STACK
           -------------------------------------------------------------------------- */
        .social-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .social-link-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(12, 12, 18, 0.85);
            border: 1px solid var(--border-neon-white);
            padding: 18px 22px;
            border-radius: 20px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            z-index: 2;
        }

        .btn-content-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-icon-wrapper {
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            font-size: 1.35rem;
            transition: transform 0.3s ease;
        }

        .social-link-btn:hover .btn-icon-wrapper {
            transform: scale(1.18) rotate(6deg);
        }

        .btn-arrow-icon {
            color: var(--text-sub);
            font-size: 1.2rem;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .social-link-btn:hover .btn-arrow-icon {
            transform: translateX(6px);
            color: #ffffff;
        }

        /* Hover Styles for TikTok & YouTube */
        .social-link-btn.tiktok-btn:hover {
            border-color: var(--tiktok-pink);
            background: rgba(255, 0, 80, 0.09);
            box-shadow: 0 0 32px rgba(255, 0, 80, 0.4);
        }

        .social-link-btn.youtube-btn:hover {
            border-color: var(--youtube-red);
            background: rgba(255, 0, 0, 0.09);
            box-shadow: 0 0 32px rgba(255, 0, 0, 0.4);
        }

        /* --------------------------------------------------------------------------
           SECTION 6: DISCORD CUSTOM CARD IN OFFICIAL DISCORD BRAND COLORS
           -------------------------------------------------------------------------- */
        .discord-card-container {
            background: rgba(88, 101, 242, 0.08);
            border: 1.5px solid rgba(88, 101, 242, 0.4);
            border-radius: 22px;
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            transition: all 0.35s ease;
            position: relative;
            text-align: left;
        }

        .discord-card-container:hover {
            border-color: var(--discord-blurple);
            box-shadow: 0 0 40px var(--discord-glow);
            background: rgba(88, 101, 242, 0.15);
        }

        .discord-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .discord-identity {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .discord-icon-badge {
            width: 44px;
            height: 44px;
            background: var(--discord-blurple);
            color: #ffffff;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            box-shadow: 0 0 20px var(--discord-glow);
        }

        .discord-user-tag {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            line-height: 1.2;
        }

        .discord-sub-label {
            font-size: 0.85rem;
            color: #8ab4f8;
            font-weight: 500;
        }

        .soon-pill {
            background: rgba(88, 101, 242, 0.3);
            color: #ffffff;
            border: 1px solid var(--discord-blurple);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.4);
        }

        .copy-tag-button {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px dashed rgba(255, 255, 255, 0.25);
            padding: 12px;
            border-radius: 12px;
            color: var(--text-sub);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
        }

        .copy-tag-button:hover {
            background: var(--discord-blurple);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 0 25px var(--discord-glow);
        }

        /* --------------------------------------------------------------------------
           SECTION 7: FOOTER STATUS AND TOAST NOTIFICATION
           -------------------------------------------------------------------------- */
        .system-footer {
            margin-top: 30px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .live-status-block {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .live-dot-green {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent-green);
        }

        #copiedToast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(140px);
            background: #ffffff;
            color: #000000;
            padding: 14px 28px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 1rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
            pointer-events: none;
        }

        #copiedToast.active {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

    <!-- Real-time Animation Core Engine (Expanded Codebase) -->
    <script>
        /* ==========================================================================
           FULL CANVAS GRAPHICS ENGINE & INTERACTION LOGIC
           ========================================================================== */
        const canvas = document.getElementById('heavyCanvas');
        const ctx = canvas.getContext('2d');

        let particleArray = [];
        const maxParticles = 80;

        function setCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', setCanvasSize);
        setCanvasSize();

        class ParticleNode {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 2.8 + 0.5;
                this.velocityX = (Math.random() - 0.5) * 0.8;
                this.velocityY = (Math.random() - 0.5) * 0.8;
                this.opacity = Math.random() * 0.75 + 0.25;
            }

            updatePosition() {
                this.x += this.velocityX;
                this.y += this.velocityY;

                if (this.x < 0) this.x = canvas.width;
