<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050506">
<meta name="description" content="KOMORNIK official profile — Poland, Roblox, TikTok, YouTube and Discord.">
<title>KOMORNIK // Ultimate Hub</title>
<style>
:root{--bg:#050506;--panel:rgba(15,15,18,.88);--line:rgba(255,255,255,.13);--muted:#77777f;--white:#f4f4f7}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 45%,#151519 0%,#09090b 36%,#030304 78%);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;overflow-x:hidden;padding:34px 15px}
#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.ambient{position:fixed;width:390px;height:390px;border-radius:50%;background:#d9d9ff;opacity:.035;filter:blur(100px);top:35%;left:50%;transform:translate(-50%,-50%);animation:ambient 8s ease-in-out infinite alternate;pointer-events:none}

/* Pływające cząsteczki */
.floating-particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;background:rgba(255,255,255,0.6);border-radius:50%;animation:floatParticle linear infinite;box-shadow:0 0 8px rgba(255,255,255,0.8)}
@keyframes floatParticle{
  0%{transform:translateY(105vh) translateX(0);opacity:0}
  20%{opacity:.8}
  80%{opacity:.8}
  100%{transform:translateY(-10vh) translateX(40px);opacity:0}
}

.card{position:relative;z-index:1;width:min(100%,520px);padding:25px 24px 20px;border:1px solid rgba(255,255,255,.18);border-radius:25px;background:linear-gradient(145deg,rgba(19,19,22,.94),rgba(6,6,8,.96));box-shadow:0 24px 100px #000b,0 0 34px rgba(216,216,255,.1),inset 0 1px rgba(255,255,255,.04);overflow:hidden;animation:cardIn 1s cubic-bezier(.2,.8,.2,1) both;transform:perspective(1100px) rotateX(var(--tilt-x,0deg)) rotateY(var(--tilt-y,0deg));transform-style:preserve-3d;transition:transform .18s ease-out,border-color .35s,box-shadow .35s}
.card:hover{border-color:rgba(255,255,255,.35);box-shadow:0 24px 100px #000c,0 0 45px rgba(216,216,255,.18),inset 0 1px rgba(255,255,255,.1)}

.topbar,.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:8px;letter-spacing:1.6px;color:#c8c8ce;text-transform:uppercase}
.online{display:flex;align-items:center;gap:8px;font-weight:800}
.dot{width:6px;height:6px;border-radius:50%;background:#f5f5f5;box-shadow:0 0 10px #fff;animation:pulse 1.8s infinite}
.tag{border:1px solid #34343a;border-radius:5px;padding:5px 8px;color:#a2a2ab;font-size:8px;letter-spacing:1px}
.rule{height:1px;background:linear-gradient(90deg,transparent,#33333a,transparent);margin:16px 0 21px}

.profile{text-align:center}
.avatar-wrap{width:116px;height:126px;margin:0 auto 12px;position:relative;display:grid;place-items:center}
/* Usunięte kółko orbitalne, dodany efekt GLOW wokół zdjęcia */
.avatar-photo{position:relative;z-index:1;width:104px;height:104px;border-radius:50%;object-fit:cover;object-position:center;border:2px solid rgba(255,255,255,.4);box-shadow:0 0 25px rgba(255,255,255,.3),0 0 50px rgba(200,200,255,.2);animation:avatarGlow 3.5s ease-in-out infinite alternate}

.beta{position:absolute;right:2px;bottom:10px;z-index:3;padding:4px 7px;border:1px solid #5a5a62;border-radius:5px;background:#08080a;font-size:8px;letter-spacing:1px;font-weight:800}
h1{margin:5px 0 10px;font-size:clamp(27px,8vw,32px);font-weight:900;letter-spacing:3px;line-height:1.15;text-shadow:0 0 20px rgba(255,255,255,.2);animation:titleGlow 4s ease-in-out infinite alternate}
.country{display:inline-flex;align-items:center;gap:7px;border:1px solid #34343a;border-radius:6px;padding:5px 10px;font-size:8px;letter-spacing:1.5px;color:#ddd;transition:all .28s ease}
.country:hover{border-color:rgba(255,255,255,.55);box-shadow:0 0 14px rgba(255,255,255,.12)}
.bio{margin:17px 0 14px;padding:14px 12px;border:1px solid #29292e;border-radius:14px;background:linear-gradient(130deg,rgba(255,255,255,.07),rgba(255,255,255,.02));font-size:12px;line-height:1.7;color:#eee;box-shadow:inset 0 0 20px rgba(255,255,255,.03),0 0 18px rgba(216,216,255,.04)}
.bio strong{font-weight:800}
.mini{font-size:9px;color:#777780;letter-spacing:1.3px;margin-top:5px}
.mini span{display:inline-block;border:1px solid #38383f;border-radius:4px;padding:2px 5px;margin:0 2px;color:#c4c4ca}

.links{display:grid;gap:9px;margin-top:13px}
.link{display:flex;align-items:center;gap:11px;min-height:54px;padding:9px 10px;border:1px solid #27272d;border-radius:13px;background:linear-gradient(110deg,rgba(255,255,255,.04),rgba(255,255,255,.01));color:inherit;text-decoration:none;transition:transform .25s,border-color .25s,background .25s,box-shadow .25s;box-shadow:inset 0 0 0 1px rgba(255,255,255,0);animation:fadeUp .7s both}
.link:nth-child(1){animation-delay:.2s}.link:nth-child(2){animation-delay:.3s}.link:nth-child(3){animation-delay:.4s}.link:nth-child(4){animation-delay:.5s}
.link:hover{transform:translateY(-3px);border-color:#777780;background:rgba(255,255,255,.07);box-shadow:0 9px 25px rgba(0,0,0,.4),0 0 20px rgba(216,216,255,.1),inset 0 0 15px rgba(255,255,255,.05)}

.iconbox{width:34px;height:34px;flex:0 0 34px;border:1px solid #303037;border-radius:10px;display:grid;place-items:center;background:#0b0b0e;color:#f3f3f5;transition:all .28s ease}
.link:hover .iconbox{border-color:rgba(255,255,255,.5);box-shadow:0 0 14px rgba(255,255,255,.15)}
.iconbox svg{width:17px;height:17px;fill:currentColor}
.linktext{min-width:0;flex:1;text-align:left}
.linktitle{font-size:11px;font-weight:750;letter-spacing:.15px}
.linksub{font-size:9px;color:#85858e;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{width:22px;height:22px;display:grid;place-items:center;border-radius:7px;background:rgba(255,255,255,.05);color:#a5a5ad;font-size:13px;transition:transform .25s}
.link:hover .arrow{transform:translate(2px,-2px);color:#fff}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
button{font:inherit;color:#eee}
.action{min-height:39px;padding:8px 7px;border:1px solid #303037;border-radius:9px;background:linear-gradient(110deg,rgba(255,255,255,.06),rgba(255,255,255,.02));font-size:8px;letter-spacing:.8px;cursor:pointer;transition:background .2s,border-color .2s,transform .2s,box-shadow .2s}
.action:hover{background:rgba(255,255,255,.12);border-color:#777780;transform:translateY(-2px);box-shadow:0 0 17px rgba(216,216,255,.12)}
.action:active{transform:scale(.98)}

.footer{margin-top:19px;padding-top:13px;border-top:1px solid rgba(255,255,255,.05);font-size:7px;letter-spacing:1px;color:#66666e}
.clock{font-variant-numeric:tabular-nums;color:#a3a3ab}
.footnote{text-align:center;font-size:7px;letter-spacing:1.3px;color:#44444b;margin-top:10px}

.toast{position:fixed;z-index:20;bottom:25px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#f0f0f2;color:#111;padding:10px 15px;border-radius:9px;font-size:12px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.6);transition:.3s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

.orb{position:fixed;z-index:0;width:170px;height:170px;border:1px solid rgba(255,255,255,.07);border-radius:50%;pointer-events:none;filter:blur(.2px)}
.orb:before,.orb:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.04);border-radius:50%;inset:18px}
.orb:after{inset:42px;background:radial-gradient(circle,rgba(255,255,255,.04),transparent 70%)}
.orb-one{top:12%;left:calc(50% - 430px);animation:floatOrb 17s ease-in-out infinite}
.orb-two{bottom:9%;right:calc(50% - 440px);width:230px;height:230px;animation:floatOrb 22s ease-in-out -7s infinite reverse}

.tap-spark{position:fixed;z-index:10;width:7px;height:7px;border:1px solid #fff;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);animation:sparkOut .55s ease-out forwards;box-shadow:0 0 12px rgba(255,255,255,.8)}
.tap-spark:before,.tap-spark:after{content:"";position:absolute;background:#fff;opacity:.75;left:50%;top:50%;transform:translate(-50%,-50%)}
.tap-spark:before{width:20px;height:1px}.tap-spark:after{width:1px;height:20px}

@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.98);filter:blur(5px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 10px #fff}50%{opacity:.45;box-shadow:0 0 3px #fff}}
@keyframes ambient{to{opacity:.075;transform:translate(-50%,-46%) scale(1.15)}}
@keyframes titleGlow{from{text-shadow:0 0 8px rgba(255,255,255,.1)}to{text-shadow:0 0 22px rgba(255,255,255,.3)}}
@keyframes avatarGlow{from{box-shadow:0 0 15px rgba(255,255,255,.2),0 0 30px rgba(200,200,255,.1);filter:grayscale(.12)}to{box-shadow:0 0 30px rgba(255,255,255,.4),0 0 60px rgba(200,200,255,.3);filter:grayscale(0)}}
@keyframes floatOrb{0%,100%{transform:translate3d(0,0,0) rotate(0deg)}50%{transform:translate3d(22px,-30px,0) rotate(22deg)}}
@keyframes sparkOut{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}100%{opacity:0;transform:translate(-50%,-50%) scale(4)}}

@media(min-width:700px){
  body{padding:52px 24px}
  .card{width:min(100%,540px);padding:32px 32px 25px}
  .bio{font-size:14px;padding:17px}
  .link{min-height:64px;padding:11px 13px}
  .linktitle{font-size:13px}.linksub{font-size:10px}
  .iconbox{width:39px;height:39px;flex-basis:39px}
  .action{min-height:44px;font-size:9px}
  h1{font-size:36px}
}
@media(max-width:420px){
  .orb{opacity:.45}
  .card{width:100%;padding:21px 16px 17px}
}
@media(prefers-reduced-motion:reduce){
  .orb,.floating-particles{display:none!important}
  .card{transform:none!important}
}
</style>
</head>

<script>
(() => {
  // Generowanie pływających cząsteczek
  const particlesContainer = document.getElementById('particlesContainer');
  const particleCount = 18;
  for (let i = 0; i < particleCount; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 3 + 1.5;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (Math.random() * 8 + 6) + 's';
    p.style.animationDelay = (Math.random() * 5) + 's';
    particlesContainer.appendChild(p);
  }

  // Tło gwiazd
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let w=0,h=0,stars=[];
  function resize(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    w=window.innerWidth;h=window.innerHeight;
    canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const count=Math.min(120,Math.floor(w*h/9500));
    stars=Array.from({length:count},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.2+.2,a:Math.random()*.6+.12,s:Math.random()*.22+.04,p:Math.random()*6.28}));
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    for(const s of stars){s.p+=.012;s.y-=s.s;if(s.y<0){s.y=h;s.x=Math.random()*w}
      const alpha=s.a*(.6+.4*Math.sin(s.p));
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(230,230,245,${alpha})`;ctx.fill();}
    requestAnimationFrame(draw);
  }
  resize();draw();window.addEventListener('resize',resize,{passive:true});

  // Powiadomienia Toast
  const toast=document.getElementById('toast');let toastTimer;
  function notify(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2100)}

  async function copyText(value, successMessage, fallbackMessage){
    try{
      if(navigator.clipboard && window.isSecureContext){
        await navigator.clipboard.writeText(value);
        notify(successMessage);
        return;
      }
    }catch(e){}
    const field=document.createElement('textarea');
    field.value=value;
    field.setAttribute('readonly','');
    field.style.position='fixed';
    field.style.opacity='0';
    field.style.left='-9999px';
    document.body.appendChild(field);
    field.focus();
    field.select();
    field.setSelectionRange(0, field.value.length);
    let copied=false;
    try{copied=document.execCommand('copy')}catch(e){}
    field.remove();
    notify(copied ? successMessage : fallbackMessage);
  }

  // Przycisk kopiowania Discord / Username (__komornik)
  document.getElementById('copyBtn').addEventListener('click',()=>{
    copyText('__komornik','Discord copied: __komornik','Discord: __komornik');
  });

  // Przycisk kopiowania linku profilu (https://komornikkk.vercel.app/)
  document.getElementById('shareBtn').addEventListener('click',()=>{
    copyText('https://komornikkk.vercel.app/','Profile link copied!','Profile link: https://komornikkk.vercel.app/');
  });

  // Zegar live
  const clockEl = document.getElementById('clock');
  function updateClock(){
    const now = new Date();
    clockEl.textContent = now.toTimeString().split(' ')[0];
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Efekt iskierek po kliknięciu
  const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function makeSpark(x,y){
    if(reducedMotion) return;
    const spark=document.createElement('i');
    spark.className='tap-spark';
    spark.style.left=x+'px';
    spark.style.top=y+'px';
    document.body.appendChild(spark);
    setTimeout(()=>spark.remove(),550);
  }
  window.addEventListener('pointerdown',e=>makeSpark(e.clientX,e.clientY),{passive:true});

  // Efekt tilt karty 3D
  const card = document.querySelector('.card');
  if(!reducedMotion){
    window.addEventListener('mousemove', e => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      if(x >= 0 && x <= rect.width && y >= 0 && y <= rect.height){
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = -((y - centerY) / centerY) * 6;
        const rotateY = ((x - centerX) / centerX) * 6;
        card.style.setProperty('--tilt-x', rotateX + 'deg');
        card.style.setProperty('--tilt-y', rotateY + 'deg');
      } else {
        card.style.setProperty('--tilt-x', '0deg');
        card.style.setProperty('--tilt-y', '0deg');
      }
    });
  }
})();
</script>
