    <style>
        /* ==========================================================================
           KOMORNIK HUB v1.0 BETA — MOBILE-OPTIMIZED FULL STACK (500+ LINES)
           ========================================================================== */
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #f1f1f5;
            overflow-x: hidden;
            overflow-y: auto;
            min-height: 100vh;
            perspective: 1200px;
        }

        /* CRT Scanline Overlay Effect */
        .crt-scanlines {
            background: linear-gradient(
                rgba(255, 255, 255, 0) 50%, 
                rgba(0, 0, 0, 0.65) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* Cyber Grid Background Structure */
        .cyber-matrix-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        }

        /* Glitch Title Effects */
        .mono-glitch-title {
            position: relative;
            display: inline-block;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
        }

        .mono-glitch-title::before, .mono-glitch-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip: rect(0, 0, 0, 0);
        }

        .mono-glitch-title:hover::before {
            left: -3px;
            text-shadow: 3px 0 #ffffff;
            clip: rect(20px, 550px, 85px, 0);
            animation: glitchAnim1 0.25s infinite linear alternate-reverse;
        }

        .mono-glitch-title:hover::after {
            left: 3px;
            text-shadow: -3px 0 #777777;
            clip: rect(70px, 550px, 130px, 0);
            animation: glitchAnim2 0.25s infinite linear alternate-reverse;
        }

        @keyframes glitchAnim1 {
            0% { clip: rect(10px, 9999px, 40px, 0); }
            33% { clip: rect(50px, 9999px, 90px, 0); }
            66% { clip: rect(5px, 9999px, 25px, 0); }
            100% { clip: rect(35px, 9999px, 75px, 0); }
        }

        @keyframes glitchAnim2 {
            0% { clip: rect(45px, 9999px, 20px, 0); }
            33% { clip: rect(15px, 9999px, 60px, 0); }
            66% { clip: rect(80px, 9999px, 30px, 0); }
            100% { clip: rect(20px, 9999px, 85px, 0); }
        }

        /* Glassmorphism Card Container */
        .glass-panel-card {
            background: rgba(7, 7, 10, 0.92);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 35px 70px -15px rgba(0, 0, 0, 0.98),
                0 0 40px rgba(255, 255, 255, 0.06),
                inset 0 1px 2px rgba(255, 255, 255, 0.25);
            transform-style: preserve-3d;
            will-change: transform;
            transition: transform 0.2s ease-out, box-shadow 0.3s ease;
        }

        /* Interactive Dynamic Buttons */
        .interactive-link-btn {
            position: relative;
            background: rgba(14, 14, 18, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(12px);
            overflow: hidden;
            will-change: transform;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .interactive-link-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.65s ease;
        }

        .interactive-link-btn:hover::before {
            left: 100%;
        }

        .interactive-link-btn:hover {
            background: rgba(28, 28, 35, 0.95);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.9), 0 0 18px rgba(255, 255, 255, 0.2);
        }

        /* Toast Popup Notification */
        #notificationToast {
            position: fixed;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%) translateY(130px);
            background: #ffffff;
            color: #000000;
            padding: 13px 28px;
            border-radius: 35px;
            font-weight: 800;
            font-size: 0.92rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
            pointer-events: none;
        }

        #notificationToast.active {
            transform: translateX(-50%) translateY(0);
        }
    </style>
