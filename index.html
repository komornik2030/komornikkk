<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOMORNIK | Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* =========================================================================
           ROZBUDOWANY ARKUSZ STYLI CSS - KOMORNIK HUB v2.0
           ========================================================================= */

        :root {
            --bg-color: #030305;
            --card-bg: rgba(10, 10, 15, 0.75);
            --border-color: rgba(255, 255, 255, 0.15);
            --neon-white: #ffffff;
            --neon-glow: rgba(255, 255, 255, 0.35);
            --discord-blurple: #5865F2;
            --discord-glow: rgba(88, 101, 242, 0.5);
            --tiktok-color: #ff0050;
            --youtube-color: #ff0000;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* Zaawansowane animowane tło Canvas */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Siatka perspektywiczna w tle */
        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.5;
        }

        /* Główny kontener profilu */
        .profile-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 
                        0 0 30px rgba(255, 255, 255, 0.05),
                        inset 0 0 20px rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            animation: containerEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform: translateY(20px);
            opacity: 0;
        }

        @keyframes containerEntrance {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Awatar z pulsującą neonową ramką */
        .avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px auto;
        }

        .avatar-glow {
            position: absolute;
            inset: -4px;
            background: linear-gradient(45deg, #ffffff, #5865F2, #ffffff);
            border-radius: 50%;
            z-index: 1;
            filter: blur(8px);
            opacity: 0.7;
            animation: rotateGlow 6s linear infinite;
        }

        @keyframes rotateGlow {
            0% { filter: blur(8px) hue-rotate(0deg); }
            100% { filter: blur(8px) hue-rotate(360deg); }
        }

        .avatar-img {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            background: #111;
            border-radius: 50%;
            border: 3px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            color: #fff;
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.2);
        }

        /* Status online kropka */
        .status-dot {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 18px;
            height: 18px;
            background-color: #23a55a;
            border: 3px solid #000;
            border-radius: 50%;
            z-index: 5;
            animation: pulseStatus 2s infinite;
        }

        @keyframes pulseStatus {
            0% { box-shadow: 0 0 0 0 rgba(35, 165, 90, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(35, 165, 90, 0); }
            100% { box-shadow: 0 0 0 0 rgba(35, 165, 90, 0); }
        }

        /* Nazwa i nagłówki */
        .title-container h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
            background: linear-gradient(180deg, #ffffff 30%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .bio-text {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        /* Sekcja linków i przycisków */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .social-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 15, 20, 0.8);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            z-index: 2;
        }

        .btn-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .social-btn:hover .btn-icon {
            transform: scale(1.15) rotate(5deg);
        }

        .btn-arrow {
            color: var(--text-muted);
            font-size: 1rem;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .social-btn:hover .btn-arrow {
            transform: translateX(4px);
            color: #fff;
        }

        /* Efekty hover dla poszczególnych przycisków */
        .social-btn.tiktok:hover {
            border-color: var(--tiktok-color);
            background: rgba(255, 0, 80, 0.08);
            box-shadow: 0 0 25px rgba(255, 0, 80, 0.3);
        }

        .social-btn.youtube:hover {
            border-color: var(--youtube-color);
            background: rgba(255, 0, 0, 0.08);
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.3);
        }

        /* Styl dla Discorda w barwach Discorda z nickiem */
        .discord-card {
            background: rgba(88, 101, 242, 0.05);
            border: 1px solid rgba(88, 101, 242, 0.3);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .discord-card:hover {
            border-color: var(--discord-blurple);
            box-shadow: 0 0 30px var(--discord-glow);
            background: rgba(88, 101, 242, 0.1);
        }

        .discord-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .discord-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .discord-icon-box {
            width: 36px;
            height: 36px;
            background: var(--discord-blurple);
            color: white;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            box-shadow: 0 0 15px var(--discord-glow);
        }

        .discord-username {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            text-align: left;
        }

        .discord-sub {
            font-size: 0.8rem;
            color: #8ab4f8;
            text-align: left;
        }

        .badge-soon {
            background: rgba(88, 101, 242, 0.2);
            color: #b9bbbe;
            border: 1px solid var(--discord-blurple);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            animation: pulseBadge 2s infinite alternate;
        }

        @keyframes pulseBadge {
            0% { opacity: 0.7; }
            100% { opacity: 1; text-shadow: 0 0 8px var(--discord-blurple); }
        }

        /* Przycisk interaktywny / kopiowanie nicku */
        .copy-action {
            display: block;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            padding: 8px;
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .copy-action:hover {
            background: var(--discord-blurple);
            color: white;
            border-color: transparent;
            box-shadow: 0 0 15px var(--discord-glow);
        }

        /* Stopka informacyjna z licznikiem linii/wersji */
        .footer-stats {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: #23a55a;
            border-radius: 50%;
            box-shadow: 0 0 8px #23a55a;
        }

        /* Powiadomienie Toast o skopiowaniu nicku */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #ffffff;
            color: #000;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
            pointer-events: none;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- Animowane płótno tła w tle (Canvas) -->
    <canvas id="bgCanvas"></canvas>
    <div class="cyber-grid"></div>

    <div class="profile-container">
        <!-- Awatar z animacją i statusem -->
        <div class="avatar-wrapper">
            <div class="avatar-glow"></div>
            <div class="avatar-img">K</div>
            <div class="status-dot"></div>
        </div>

        <!-- Nagłówek -->
        <div class="title-container">
            <h1>KOMORNIK</h1>
            <div class="verified-badge">
                <span>⚡ OFICJALNY HUB</span>
            </div>
        </div>

        <p class="bio-text">Wszystkie moje media społecznościowe i projekty w jednym miejscu. Sprawdź nowości!</p>

        <!-- Lista linków -->
        <div class="links-wrapper">
            
            <!-- TikTok -->
            <a href="https://www.tiktok.com/@__komornik?_r=1&_t=ZN-9AuufJQdPE6" target="_blank" class="social-btn tiktok">
                <div class="btn-left">
                    <div class="btn-icon">🎬</div>
                    <span>TikTok</span>
                </div>
                <div class="btn-arrow">→</div>
            </a>

            <!-- YouTube -->
            <a href="https://youtube.com/@komornik_2022" target="_blank" class="social-btn youtube">
                <div class="btn-left">
                    <div class="btn-icon">🎥</div>
                    <span>YouTube</span>
                </div>
                <div class="btn-arrow">→</div>
            </a>

            <!-- Discord (Wkrótce + Nick) -->
            <div class="discord-card">
                <div class="discord-header">
                    <div class="discord-info">
                        <div class="discord-icon-box">💬</div>
                        <div>
                            <div class="discord-username">__komornik</div>
                            <div class="discord-sub">Serwer Discord</div>
                        </div>
                    </div>
                    <span class="badge-soon">Wkrótce</span>
                </div>
                <button class="copy-action" onclick="copyDiscordNick()">Skopiuj nick Discorda</button>
            </div>

        </div>

        <!-- Stopka -->
        <div class="footer-stats">
            <div class="live-indicator">
                <span class="live-dot"></span>
                <span>SYSTEM ONLINE</span>
            </div>
            <span>v2.5 PRO</span>
        </div>
    </div>

    <!-- Toast powiadomienia -->
    <div id="toast">Skopiowano nick: __komornik! 📋</div>

    <script>
        /* =========================================================================
           SILNIK JAVASCRIPT: PŁYNNE ANIMACJE TŁA I INTERAKCJA
           ========================================================================= */

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];
        let numberOfParticles = 55;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.speedY = (Math.random() - 0.5) * 0.6;
                this.opacity = Math.random() * 0.7 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();

                // Łączenie cząsteczek delikatnymi liniami dla efektu sieci cyber
                for (let j = i; j < particlesArray.length; j++) {
                    const dx = particlesArray[i].x - particlesArray[j].x;
                    const dy = particlesArray[i].y - particlesArray[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 110) {
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.08 * (1 - distance / 110)})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
                        ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        // Funkcja kopiowania nicku Discorda z powiadomieniem Toast
        function copyDiscordNick() {
            navigator.clipboard.writeText('__komornik').then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2500);
            }).catch(err => {
                console.error('Błąd kopiowania: ', err);
            });
        }
    </script>
</body>
</html>
