*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 45%,#151519 0%,#09090b 36%,#030304 78%);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;overflow-x:hidden;padding:34px 15px}

/* Tło wideo */
.bg-video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;pointer-events:none;z-index:0;opacity:0.35}

/* Kosmiczna przestrzeń i gęste cząsteczki w tle */
#spaceCanvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:0}
.ambient{position:fixed;width:500px;height:500px;border-radius:50%;background:#d9d9ff;opacity:.08;filter:blur(130px);top:35%;left:50%;transform:translate(-50%,-50%);animation:ambient 10s ease-in-out infinite alternate;pointer-events:none}

.space-dust{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.space-particle{position:absolute;background:#fff;border-radius:50%;animation:driftSpace linear infinite;box-shadow:0 0 10px #fff,0 0 20px rgba(200,200,255,0.9)}
@keyframes driftSpace{
  0%{transform:translateY(105vh) translateX(0) scale(0.4);opacity:0}
  15%{opacity:1}
  85%{opacity:1}
  100%{transform:translateY(-10vh) translateX(80px) scale(1.5);opacity:0}
}

.card{position:relative;z-index:1;width:min(100%,520px);padding:25px 24px 20px;border:1px solid rgba(255,255,255,.22);border-radius:25px;background:linear-gradient(145deg,rgba(19,19,22,.94),rgba(6,6,8,.96));box-shadow:0 24px 100px #000b,0 0 45px rgba(216,216,255,.15),inset 0 1px rgba(255,255,255,.06);overflow:hidden;animation:cardIn 1s cubic-bezier(.2,.8,.2,1) both}

@media (min-width: 768px) {
  .card { width: min(100%, 650px); padding: 32px 36px 26px; }
}

.topbar,.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:8px;letter-spacing:1.6px;color:#c8c8ce;text-transform:uppercase}
.online{display:flex;align-items:center;gap:8px;font-weight:800}
.dot{width:6px;height:6px;border-radius:50%;background:#f5f5f5;box-shadow:0 0 10px #fff;animation:pulse 1.8s infinite}
.tag-group{display:flex;gap:6px;align-items:center}
.tag{border:1px solid #34343a;border-radius:5px;padding:5px 8px;color:#a2a2ab;font-size:8px;letter-spacing:1px}
.sfx-toggle{border:1px solid #34343a;border-radius:5px;padding:5px 8px;color:#a2a2ab;font-size:8px;letter-spacing:1px;background:none;cursor:pointer;transition:all .2s}
.sfx-toggle:hover{border-color:#fff;color:#fff}
.rule{height:1px;background:linear-gradient(90deg,transparent,#33333a,transparent);margin:16px 0 21px}

/* Profil */

.avatar-wrap{width:116px;height:126px;margin:0 auto 12px;position:relative;display:grid;place-items:center;cursor:pointer;user-select:none}
.avatar-photo{position:relative;z-index:1;width:104px;height:104px;border-radius:50%;object-fit:cover;object-position:center;border:2px solid rgba(255,255,255,.5);box-shadow:0 0 30px rgba(255,255,255,.4),0 0 60px rgba(200,200,255,.3);animation:avatarGlow 3.5s ease-in-out infinite alternate}

.beta{position:absolute;right:2px;bottom:10px;z-index:3;padding:4px 7px;border:1px solid #5a5a62;border-radius:5px;background:#08080a;font-size:8px;letter-spacing:1px;font-weight:800}

.country{display:inline-flex;align-items:center;gap:7px;border:1px solid #34343a;border-radius:6px;padding:5px 12px;font-size:9px;letter-spacing:1.5px;color:#ddd;transition:all .28s ease;cursor:pointer;user-select:none;margin-bottom:8px}

.bio{margin:10px 0 14px;padding:14px 12px;border:1px solid #29292e;border-radius:14px;background:linear-gradient(130deg,rgba(255,255,255,.07),rgba(255,255,255,.02));font-size:12px;line-height:1.7;color:#eee;box-shadow:inset 0 0 20px rgba(255,255,255,.03),0 0 18px rgba(216,216,255,.04);cursor:pointer;transition:all 0.3s ease;width:100%}

.toast{position:fixed;z-index:999;bottom:25px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#f0f0f2;color:#111;padding:10px 16px;border-radius:9px;font-size:12px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.8);transition:.3s;white-space:nowrap}

/* Cząsteczki po kliknięciu i smuga kursora */
.click-particle{position:fixed;z-index:99;pointer-events:none;background:#fff;border-radius:50%;box-shadow:0 0 12px #fff,0 0 25px rgba(200,200,255,0.9);animation:clickParticleUp 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards}
.cursor-trail{position:fixed;z-index:98;pointer-events:none;width:6px;height:6px;background:rgba(255,255,255,0.8);border-radius:50%;box-shadow:0 0 8px #fff;transform:translate(-50%,-50%);animation:fadeTrail 0.5s linear forwards}
@keyframes fadeTrail{
  0%{transform:translate(-50%,-50%) scale(1);opacity:0.8}

@keyframes clickParticleUp{
  0%{transform:translate(-50%,-50%) scale(1.2);opacity:1}
  100%{transform:translate(calc(-50% + var(--dx)), calc(-50% - var(--dy))) scale(0.1);opacity:0}

@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

@keyframes titleGlow{from{text-shadow:0 0 8px rgba(255,255,255,.1)}to{text-shadow:0 0 22px rgba(255,255,255,.3)}}
@keyframes avatarGlow{from{box-shadow:0 0 20px rgba(255,255,255,.3)}to{box-shadow:0 0 40px rgba(255,255,255,.6)}}
</style>

<script>
// --- WEB AUDIO API SYNTHESIZER (SFX) ---
let sfxEnabled = false;
let audioCtx = null;

function toggleSFX() {
  sfxEnabled = !sfxEnabled;
  const btn = document.getElementById('sfxToggle');
  btn.textContent = sfxEnabled ? 'SFX: ON' : 'SFX: OFF';
  btn.style.borderColor = sfxEnabled ? '#fff' : '#34343a';
  btn.style.color = sfxEnabled ? '#fff' : '#a2a2ab';
  if (sfxEnabled) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    playBeep(880, 0.15);
  }
}

function playBeep(freq, duration) {
  if (!sfxEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

// --- ZEGAR & SESJA ---
let secondsOnSite = 0;
function runClock() {
  secondsOnSite++;
  var clock = document.getElementById('clock');
  var timer = document.getElementById('sessionTimer');
  if (clock) {
    var now = new Date();
    var h = String(now.getHours()).padStart(2, '0');
    var m = String(now.getMinutes()).padStart(2, '0');
    var s = String(now.getSeconds()).padStart(2, '0');
    clock.innerHTML = h + ':' + m + ':' + s;
  }
  if (timer) {
    timer.textContent = 'Active: ' + secondsOnSite + 's';
  }
}
setInterval(runClock, 1000);
runClock();

// --- POWIADOMIENIA TOAST ---
function showToast(msg) {
  var t = document.getElementById('toast');
  if (t) {
    t.textContent = msg;
    t.className = 'toast show';
    setTimeout(function(){ t.className = 'toast'; }, 2000);
  }
}

// --- KOPIOWANIE ---
function doCopy(text, msg) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function(){
      showToast(msg);
    }).catch(function(){
      fallback(text, msg);
    });
  } else {
    fallback(text, msg);
  }
}

function fallback(text, msg) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand('copy');
    showToast(msg);
  } catch(e) {
    showToast('Failed to copy');
  }
  document.body.removeChild(ta);
}

function copyDiscord(btn) {
  triggerAnim(btn, 'anim-btn');
  playBeep(1046, 0.12);
  doCopy('__komornik', 'Discord copied: __komornik');
}

function copyProfile(btn) {
  triggerAnim(btn, 'anim-btn');
  playBeep(1318, 0.12);
  doCopy('komornikkk.vercel.app', 'Profile link copied: komornikkk.vercel.app');
}

// --- ANIMACJE ELEMENTÓW ---
function triggerAnim(el, className) {
  if (!el) return;
  el.classList.remove(className);
  void el.offsetWidth;
  el.classList.add(className);
  setTimeout(function(){ el.classList.remove(className); }, 700);
}

// Cząsteczki po kliknięciu oraz płynna smuga kursora (Cursor Trail)
window.addEventListener('pointerdown', function(e) {
  playBeep(220, 0.05);
  for(var i = 0; i < 5; i++) {
    var p = document.createElement('div');
    p.className = 'click-particle';
    var sz = Math.random() * 5 + 2;
    p.style.width = sz + 'px';
    p.style.height = sz + 'px';
    p.style.left = e.clientX + 'px';
    p.style.top = e.clientY + 'px';
    p.style.setProperty('--dx', ((Math.random() - 0.5) * 80) + 'px');
    p.style.setProperty('--dy', (Math.random() * 70 + 20) + 'px');
    document.body.appendChild(p);
    (function(particle){
      setTimeout(function(){ particle.remove(); }, 800);
    })(p);
  }
});

let lastTrailTime = 0;
window.addEventListener('pointermove', function(e) {
  const now = Date.now();
  if (now - lastTrailTime > 40) { // ograniczenie częstotliwości tworzenia smug
    lastTrailTime = now;
    const trail = document.createElement('div');
    trail.className = 'cursor-trail';
    trail.style.left = e.clientX + 'px';
    trail.style.top = e.clientY + 'px';
    document.body.appendChild(trail);
    setTimeout(() => trail.remove(), 500);
  }
});

// Generowanie cząsteczek tła
var dust = document.getElementById('spaceDustContainer');
if (dust) {
  for (var i = 0; i < 35; i++) {
    var p = document.createElement('div');
    p.className = 'space-particle';
    var sz = Math.random() * 3 + 1;
    p.style.width = sz + 'px';
    p.style.height = sz + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (Math.random() * 8 + 4) + 's';
    p.style.animationDelay = (Math.random() * 5) + 's';
    dust.appendChild(p);
  }
}

// Renderowanie Canvas
var cvs = document.getElementById('spaceCanvas');
if (cvs) {
  var ctx = cvs.getContext('2d');
  var w = cvs.width = window.innerWidth;
  var h = cvs.height = window.innerHeight;
  var stars = [];
  for(var j=0; j<100; j++) {
    stars.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.5 + 0.3,
      a: Math.random() * 0.8 + 0.2,
      s: Math.random() * 0.3 + 0.05,
      p: Math.random() * 6.28
    });
  }

  function drawStars() {
    ctx.clearRect(0, 0, w, h);
    for (var k = 0; k < stars.length; k++) {
      var st = stars[k];
      st.p += 0.015;
