<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="KOMORNIK — oficjalny hub profili społecznościowych, gaming i kontakt.">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="index,follow">
  <title>KOMORNIK — Ultimate Cyber Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            orbitron: ["Orbitron", "sans-serif"],
            rajdhani: ["Rajdhani", "sans-serif"],
            sans: ["Inter", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #030303;
      --panel: rgba(9, 9, 12, .82);
      --line: rgba(255,255,255,.14);
      --muted: #96969f;
      --white: #f7f7fb;
      --ease: cubic-bezier(.2,.8,.2,1);
      --white-glow: rgba(255,255,255,.34);
      --white-glow-soft: rgba(255,255,255,.12);
    }
    * { box-sizing: border-box; }
    
    #profileCard, .page-shell { visibility: visible; }
    #profileCard { opacity: 1; }
    [hidden] { display: none !important; }
    
    html { min-height: 100%; background: var(--bg); scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh; overflow-x: hidden; background: var(--bg); color: var(--white);
      font-family: Inter, system-ui, sans-serif; isolation: isolate;
      -webkit-tap-highlight-color: transparent;
    }
    a, button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    a:focus-visible, button:focus-visible {
      outline: 2px solid white; outline-offset: 4px;
    }
    #starCanvas, #fxCanvas, .grid-layer, .scanlines, .ambient {
      position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none;
    }
    #starCanvas { z-index: -4; }
    #fxCanvas { z-index: -3; }
    .grid-layer {
      z-index: -2; opacity: .36;
      background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(ellipse at center, #000 18%, transparent 82%);
    }
    .scanlines {
      z-index: 4; opacity: .10;
      background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(0,0,0,.7) 4px);
    }
    .ambient {
      z-index: -1; inset: auto; width: 520px; height: 520px; top: 18%; left: 50%;
      transform: translateX(-50%); border-radius: 50%;
      background: rgba(255,255,255,.065); filter: blur(125px);
    }
    .page-shell {
      visibility: visible;
      min-height: 100svh; display: grid; place-items: center; 
      padding: 32px 16px 44px;
      padding-left: max(14px, env(safe-area-inset-left)); 
      padding-right: max(14px, env(safe-area-inset-right));
      position: relative; z-index: 1; width: 100%;
    }
    .profile-card {
      width: min(100%, 760px) !important; position: relative; overflow: hidden;
      padding: clamp(18px, 4.2vw, 38px) !important; 
      border-radius: clamp(20px, 3.5vw, 32px) !important;
      border: 1px solid rgba(255,255,255,.27) !important;
      background: linear-gradient(145deg, rgba(17,17,21,.91), rgba(5,5,7,.91) 58%, rgba(13,13,16,.88));
      box-shadow: 0 28px 90px #000, 0 0 22px var(--white-glow-soft), 0 0 65px rgba(255,255,255,.07), inset 0 1px rgba(255,255,255,.2) !important;
      backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      transform-style: preserve-3d; transform-origin: center top;
      transition: border-color .35s ease, box-shadow .35s ease, transform .18s ease-out;
      animation: cardEnter .85s cubic-bezier(.2,.8,.2,1) both;
    }
    .profile-card::before {
      content: ""; position: absolute; inset: 0 0 auto; height: 2px;
      background: linear-gradient(90deg, transparent, #fff, #aaa, #fff, transparent); opacity: .95;
      filter: drop-shadow(0 0 6px #fff);
    }
    .profile-card:hover {
      border-color: rgba(255,255,255,.29) !important;
      box-shadow: 0 35px 100px rgba(0,0,0,.86), 0 0 52px rgba(255,255,255,.09), inset 0 1px rgba(255,255,255,.2) !important;
    }
    .status-bar {
      display:flex; justify-content:space-between; align-items:center; gap:12px;
      border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:16px; margin-bottom:27px;
      color:#c4c4cb; font:700 11px Rajdhani,sans-serif; letter-spacing:.15em;
    }
    .online-dot { width:8px; height:8px; border-radius:50%; display:inline-block; background:#fff; box-shadow: 0 0 8px #fff, 0 0 20px rgba(255,255,255,.7); position:relative; }
    .online-dot::after { content:""; position:absolute; inset:-5px; border:1px solid rgba(255,255,255,.65); border-radius:50%; animation: ping 2s ease-out infinite; }
    .version { padding:6px 9px; border:1px solid rgba(255,255,255,.13); background:rgba(255,255,255,.045); border-radius:7px; color:#ddd; font:10px Orbitron,sans-serif; letter-spacing:.08em; box-shadow: 0 0 12px rgba(255,255,255,.035); }
    .avatar-wrap { width:142px; height:142px; margin:0 auto 23px; position:relative; cursor:pointer; transition: filter .3s ease, transform .35s ease; animation: avatarFloat 5s ease-in-out infinite; }
    .avatar-wrap:hover { filter:drop-shadow(0 0 20px #fff5); transform:translateY(-3px) rotate(-1deg); }
    .avatar-aura {
      position:absolute; inset:-10px; border-radius:50%;
      background:conic-gradient(from 0deg, transparent 0 12%, #555 20%, #fff 34%, transparent 47% 62%, #aaa 76%, transparent 88%);
      filter:blur(14px); opacity:.7 !important; animation: rotate 9s linear infinite;
      transition:opacity .3s ease, filter .3s ease;
    }
    .avatar-wrap:hover .avatar-aura { opacity:.9 !important; filter:blur(15px); }
    .avatar-ring { display:none !important; }
    .avatar-frame { position:relative; width:100%; height:100%; padding:4px; border-radius:50%; background:#050505; border:1px solid rgba(255,255,255,.5); overflow:hidden; box-shadow: 0 0 12px rgba(255,255,255,.25), 0 0 30px rgba(255,255,255,.12); }
    .avatar-frame img { width:100%; height:100%; object-fit:cover; border-radius:50%; filter:grayscale(1) brightness(1.08) contrast(1.13); transition:transform .5s var(--ease), filter .5s ease; }
    .avatar-wrap:hover .avatar-frame img { transform:scale(1.08); filter:grayscale(.65) brightness(1.12) contrast(1.15); }
    .beta-chip {
      position:absolute; bottom:-3px; right:-7px; z-index:2; padding:5px 9px;
      border-radius:7px; border:1px solid rgba(255,255,255,.45); background:#050505;
      box-shadow:0 0 18px rgba(255,255,255,.14); font:800 9px Orbitron,sans-serif; letter-spacing:.1em;
    }

    #cursorGlow, #cursorCore {
      position: fixed; top: 0; left: 0; pointer-events: none; z-index: 100;
      opacity: 0; transform: translate3d(-50%, -50%, 0); border-radius: 50%;
      transition: opacity .18s ease, width .18s ease, height .18s ease, border-color .18s ease, background .18s ease;
    }
    #cursorGlow {
      width: 30px; height: 30px; border: 1px solid rgba(255,255,255,.58);
      box-shadow: 0 0 12px rgba(255,255,255,.16), inset 0 0 10px rgba(255,255,255,.045);
      backdrop-filter: blur(1px);
    }
    #cursorCore { width: 4px; height: 4px; background: #fff; box-shadow: 0 0 9px rgba(255,255,255,.9); }
    body.cursor-active #cursorGlow, body.cursor-active #cursorCore { opacity: 1; }
    body.cursor-hover #cursorGlow { width: 44px; height: 44px; border-color: rgba(255,255,255,.9); box-shadow: 0 0 20px rgba(255,255,255,.24), inset 0 0 14px rgba(255,255,255,.08); }
    @media (hover: hover) and (pointer: fine) {
      body.cursor-active, body.cursor-active a, body.cursor-active button, body.cursor-active input { cursor: none !important; }
    }
    @media (hover: none), (pointer: coarse), (prefers-reduced-motion: reduce) {
      #cursorGlow, #cursorCore { display: none !important; }
    }

    .title-glitch {
      position:relative; display:inline-block; font:900 clamp(27px,7vw,39px)/1.2 Orbitron,sans-serif;
      letter-spacing:.08em; text-shadow: 0 0 8px rgba(255,255,255,.42), 0 0 26px rgba(255,255,255,.25);
    }
    .title-glitch::before, .title-glitch::after {
      content:attr(data-text); position:absolute; inset:0; pointer-events:none; opacity:0;
    }
    .title-glitch:hover::before { opacity:.8; transform:translateX(-2px); clip-path:inset(15% 0 62% 0); text-shadow:2px 0 #fff; animation:glitchA .25s steps(2,end) infinite; }
    .title-glitch:hover::after { opacity:.7; transform:translateX(2px); clip-path:inset(58% 0 17% 0); text-shadow:-2px 0 #777; animation:glitchB .2s steps(2,end) infinite; }
    .country-chip {
      display:inline-flex; align-items:center; gap:7px; border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.045); border-radius:7px; padding:6px 11px;
      color:#d4d4dc; font:700 11px Rajdhani,sans-serif; letter-spacing:.16em;
      box-shadow: 0 0 12px rgba(255,255,255,.035);
    }
    .bio-box {
      margin:23px 0 21px; padding:17px 14px; border-radius:17px;
      border:1px solid rgba(255,255,255,.12); background:linear-gradient(120deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
      box-shadow:inset 0 1px rgba(255,255,255,.035); transition:border-color .3s ease, transform .3s ease;
    }
    .bio-box:hover { border-color:rgba(255,255,255,.26); transform:translateY(-2px); }
    .game-chip { display:inline-flex; padding:4px 9px; border-radius:6px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); font:700 10px Orbitron,sans-serif; letter-spacing:.08em; box-shadow: 0 0 12px rgba(255,255,255,.035); }
    .social-list { display:grid; gap:11px; }
    .social-link {
      display:flex; justify-content:space-between; align-items:center; gap:12px; width:100%;
      padding:12px 13px; min-height:76px; position:relative; overflow:hidden; isolation:isolate;
      border:1px solid rgba(255,255,255,.2); border-radius:17px;
      background:rgba(17,17,21,.72); text-align:left; color:white; text-decoration:none;
      box-shadow: inset 0 0 18px rgba(255,255,255,.018);
      transition:transform .24s ease, background .24s ease, border-color .24s ease, box-shadow .24s ease !important;
    }
    .social-link::before {
      content:""; position:absolute; z-index:-1; inset:0; opacity:0;
      background:linear-gradient(110deg, transparent 15%,rgba(255,255,255,.12) 48%,transparent 78%);
      transform:translateX(-120%); transition:transform .55s ease, opacity .25s ease; pointer-events:none;
    }
    .social-link:hover::before { opacity:1; transform:translateX(120%); }
    .social-link:hover {
      transform:translateY(-3px); background:rgba(29,29,35,.92); border-color:rgba(255,255,255,.42) !important;
      box-shadow: 0 0 12px rgba(255,255,255,.15), 0 0 28px rgba(255,255,255,.08), inset 0 0 14px rgba(255,255,255,.04) !important;
    }
    .social-link:active, .utility-btn:active, button:active { transform:scale(.975); }
    .social-icon {
      width:44px; height:44px; flex:0 0 44px; display:grid; place-items:center;
      border:1px solid rgba(255,255,255,.17); border-radius:12px; background:#101013;
      box-shadow:0 0 12px rgba(255,255,255,.055); transition:transform .3s var(--ease), border-color .3s ease;
    }
    .social-link:hover .social-icon { transform:scale(1.06) rotate(-2deg); border-color:rgba(255,255,255,.4); }
    .social-icon svg { width:22px; height:22px; fill:currentColor; }
    .social-name { font:700 14px Orbitron,sans-serif; letter-spacing:.02em; }
    .social-sub { margin-top:4px; color:#96969f; font:600 12px Rajdhani,sans-serif; letter-spacing:.04em; }
    .arrow-box { display:grid; place-items:center; width:31px; height:31px; flex:0 0 31px; border-radius:99px; background:rgba(255,255,255,.045); color:#aaa; box-shadow: 0 0 12px rgba(255,255,255,.055); transition:background .25s,color .25s,transform .25s; }
    .social-link:hover .arrow-box { background:#fff; color:#000; transform:translateX(2px); }
    .social-link.disabled { opacity:.65; }
    .social-link.disabled:hover { transform:none; box-shadow:none; border-color:rgba(255,255,255,.12); }
    .utility-row { display:flex; gap:10px; margin-top:15px; }
    .utility-btn {
      flex:1; display:flex; align-items:center; justify-content:center; gap:8px; min-height:43px;
      border:1px solid rgba(255,255,255,.14); border-radius:11px; background:rgba(255,255,255,.035);
      color:#dedee4; font:700 10px Orbitron,sans-serif; letter-spacing:.04em; cursor:pointer;
      box-shadow: 0 0 12px rgba(255,255,255,.055);
      transition:background .25s,border-color .25s,transform .25s;
    }
    .utility-btn:hover {
      background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.32); transform:translateY(-1px);
      box-shadow: 0 0 12px rgba(255,255,255,.15), 0 0 28px rgba(255,255,255,.08), inset 0 0 14px rgba(255,255,255,.04) !important;
    }
    .footer-line { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-top:23px; padding-top:15px; border-top:1px solid rgba(255,255,255,.09); color:#777780; font:600 10px Rajdhani,sans-serif; letter-spacing:.09em; }

    .live-status {
      margin-top:15px; padding:13px 14px; border:1px solid rgba(255,255,255,.3) !important;
      border-radius:13px; background: linear-gradient(135deg, rgba(255,255,255,.055), rgba(0,0,0,.88)) !important;
      box-shadow: 0 0 18px rgba(255,255,255,.055), inset 0 0 22px rgba(255,255,255,.025) !important;
      font:600 10px Rajdhani,sans-serif; letter-spacing:.08em;
    }
    .live-status-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; color:#fff !important; text-shadow: 0 0 8px rgba(255,255,255,.3); font:700 10px Orbitron,sans-serif; }
    .live-status-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .live-status-item { display:flex; justify-content:space-between; gap:8px; color:#85858f; }
    .live-status-value { color:#ffffff !important; text-shadow: 0 0 8px rgba(255,255,255,.3); text-align:right; }
    
    .terminal-panel {
      margin-top:12px; padding:14px; border:1px solid rgba(255,255,255,.3) !important;
      border-radius:13px; background: linear-gradient(135deg, rgba(255,255,255,.055), rgba(0,0,0,.88)) !important;
      box-shadow: 0 0 18px rgba(255,255,255,.055), inset 0 0 22px rgba(255,255,255,.025) !important;
    }
    .terminal-output { min-height:92px; max-height:180px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; color:#f0f0f0; font:500 12px/1.6 monospace; }
    .terminal-form { display:flex; gap:8px; margin-top:10px; }
    .terminal-prompt { color:#ffffff !important; text-shadow: 0 0 8px rgba(255,255,255,.3); align-self:center; font:700 12px monospace; }
    .terminal-input { min-width:0; flex:1; border:1px solid rgba(255,255,255,.35) !important; border-radius:8px; padding:9px 10px; background:#080808; color:#ffffff; outline:none; font:12px monospace; }
    .terminal-input:focus { border-color:rgba(255,255,255,.65) !important; }
    .terminal-run { border:1px solid rgba(255,255,255,.35) !important; border-radius:8px; padding:0 12px; color:#ffffff !important; text-shadow: 0 0 8px rgba(255,255,255,.3); background:rgba(255,255,255,.06); font:700 10px Orbitron,sans-serif; }
    
    #toast {
      position:fixed; z-index:20; bottom:max(20px,env(safe-area-inset-bottom)); left:50%;
      transform:translate(-50%,140px); opacity:0; pointer-events:none;
      display:flex; align-items:center; gap:10px; max-width:calc(100vw - 30px);
      padding:12px 18px; border-radius:999px; background:#f5f5f5; color:#050505;
      box-shadow:0 15px 50px rgba(0,0,0,.65); font:800 11px Orbitron,sans-serif; letter-spacing:.03em;
      transition:transform .4s var(--ease),opacity .3s ease;
    }
    #toast.show { transform:translate(-50%,0); opacity:1; }
    .toast-dot { width:7px; height:7px; border-radius:50%; background:#111; box-shadow:0 0 0 3px #ddd; }
    
    /* Intro Overlay fixed styling */
    #intro {
      position:fixed; inset:0; z-index:30; display:grid; place-items:center; padding:24px;
      background:#030303; transition:opacity .55s ease, visibility .55s ease;
    }
    #intro.hidden-intro { opacity:0; visibility:hidden; pointer-events:none; }
    .intro-inner { width:min(390px,100%); text-align:center; }
    .intro-mark { font:900 clamp(24px,7vw,34px) Orbitron,sans-serif; letter-spacing:.12em; text-shadow:0 0 25px rgba(255,255,255,.4); }
    .intro-caption { margin-top:14px; color:#a5a5ad; font:700 10px Rajdhani,sans-serif; letter-spacing:.22em; }
    .progress-track { height:3px; margin-top:25px; border-radius:5px; background:#25252a; overflow:hidden; }
    .progress-fill { height:100%; width:0; background:#fff; box-shadow:0 0 15px #fff; animation:loadProgress 1.25s ease-out forwards; }
    .skip-intro { margin-top:19px; padding:8px 12px; color:#777; font:700 9px Orbitron,sans-serif; letter-spacing:.1em; background:transparent; border:0; cursor:pointer; }
    .system-time { font-variant-numeric:tabular-nums; }
    
    .fx-burst { position:fixed; z-index:9999; pointer-events:none; width:0; height:0; }
    .fx-ripple { position:fixed; z-index:9998; width:14px; height:14px; border:1px solid rgba(255,255,255,.9); border-radius:50%; pointer-events:none; transform:translate(-50%,-50%) scale(.2); animation:clickRipple .55s ease-out forwards; box-shadow:0 0 12px rgba(255,255,255,.22); }
    @keyframes clickRipple { to { transform:translate(-50%,-50%) scale(5); opacity:0; border-width:2px; } }
    .fx-burst i { position:absolute; left:0; top:0; width:5px; height:5px; border-radius:1px; background:#fff; box-shadow:0 0 9px #fff; animation:burstPiece .65s cubic-bezier(.1,.7,.2,1) forwards; }
    @keyframes burstPiece { to { transform:translate(var(--dx),var(--dy)) rotate(240deg) scale(0); opacity:0; } }

    .visitor-panel {
      margin-top: 13px; padding: 14px; border: 1px solid rgba(255,255,255,.28); border-radius: 13px;
      background: linear-gradient(130deg, rgba(255,255,255,.055), rgba(0,0,0,.88));
      box-shadow: 0 0 22px rgba(255,255,255,.06), inset 0 0 18px rgba(255,255,255,.025);
    }
    .visitor-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; font:700 10px Orbitron,sans-serif; letter-spacing:.08em; }
    .visitor-count-wrap { display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:#fff; font:700 13px Rajdhani,sans-serif; }
    .visitor-count-wrap .counterapi { display:inline-flex; align-items:center; min-height:24px; color:#fff; font:800 18px Orbitron,sans-serif; text-shadow:0 0 10px rgba(255,255,255,.42); }

    @keyframes cardEnter { from { opacity:0; transform:translateY(24px) scale(.975); filter:blur(8px); } to { opacity:1; transform:translateY(0) scale(1); filter:blur(0); } }
    @keyframes avatarFloat { 0%,100% { translate: 0 0; } 50% { translate: 0 -5px; } }
    @keyframes rotate { to { transform:rotate(360deg); } }
    @keyframes ping { 0% { transform:scale(.6); opacity:.85; } 100% { transform:scale(1.8); opacity:0; } }
    @keyframes loadProgress { 0% { width:0; } 100% { width:100%; } }
    @keyframes glitchA { 0%,100% { clip-path:inset(10% 0 70% 0); } 50% { clip-path:inset(48% 0 30% 0); } }
    @keyframes glitchB { 0%,100% { clip-path:inset(65% 0 12% 0); } 50% { clip-path:inset(20% 0 58% 0); } }

    @media (min-width: 900px) {
      .page-shell { padding-top: clamp(30px, 5vh, 70px); padding-bottom: 70px; }
      .pr
