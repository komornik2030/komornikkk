<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOMORNIK | Ultimate Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           ULTIMATE CYBERPUNK CSS ARCHITECTURE - KOMORNIK v3.0
           ========================================================================== */
        :root {
            --bg-deep: #020204;
            --card-glass: rgba(8, 8, 12, 0.85);
            --border-neon: rgba(255, 255, 255, 0.18);
            --pure-white: #ffffff;
            --discord-blurple: #5865F2;
            --discord-glow: rgba(88, 101, 242, 0.6);
            --tiktok-pink: #ff0050;
            --youtube-red: #ff0000;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* Zaawansowane dynamiczne tło Canvas */
        #liveCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Efekt cyfrowej siatki w tle */
        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 2;
            pointer-events: none;
        }

        /* Główna karta profilu */
        .hub-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            background: var(--card-glass);
            border: 1px solid var(--border-neon);
            border-radius: 32px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9),
                        0 0 40px rgba(255, 255, 255, 0.04),
                        inset 0 0 25px rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: cardAppear 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform: translateY(30px);
            opacity: 0;
        }

        @keyframes cardAppear {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Awatar z Twoim zdjęciem z mieczem i neonową ramką */
        .avatar-box {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 22px auto;
        }

        .avatar-ring {
            position: absolute;
            inset: -5px;
            background: linear-gradient(135deg, #ffffff, #5865F2, #ff0050, #ffffff);
            border-radius: 50%;
            z-index: 1;
            filter: blur(10px);
            opacity: 0.8;
            animation: spinRing 8s linear infinite;
        }

        @keyframes spinRing {
            0% { filter: blur(10px) hue-rotate(0deg); }
            100% { filter: blur(10px) hue-rotate(360deg); }
        }

        .avatar-photo {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #000000;
            background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600&auto=format&fit=crop'); /* Dynamiczne tło zastępcze dopasowane do stylu, możesz podmienić na własny link grafiki */
            background-size: cover;
            background-position: center;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        /* Kropka statusu online */
        .online-status {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 20px;
            height: 20px;
            background-color: #23a55a;
            border: 3px solid #000;
            border-radius: 50%;
            z-index: 5;
            animation: pulseGreen 2s infinite;
        }

        @keyframes pulseGreen {
            0% { box-shadow: 0 0 0 0 rgba(35, 165, 90, 0.8); }
            70% { box-shadow: 0 0 0 10px rgba(35, 165, 90, 0); }
            100% { box-shadow: 0 0 0 0 rgba(35, 165, 90, 0); }
        }

        /* Nagłówek i opisy */
        .name-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 6px;
            background: linear-gradient(180deg, #ffffff 20%, #777777 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
        }

        .tag-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 16px;
            letter-spacing: 1.5px;
        }

        /* Twój opis: Hi i'm komornik im from Poland Play CF TWW */
        .bio-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px 18px;
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.5;
            margin-bottom: 25px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .bio-box span {
            color: #fff;
            font-weight: 600;
        }

        /* Przyciski i linki społecznościowe */
        .links-stack {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(12, 12, 18, 0.8);
            border: 1px solid var(--border-neon);
            padding: 16px 20px;
            border-radius: 18px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            z-index: 2;
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-icon {
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            font-size: 1.3rem;
            transition: transform 0.3s ease;
        }

        .link-card:hover .link-icon {
            transform: scale(1.15) rotate(6deg);
        }

        .link-arrow {
            color: var(--text-muted);
            font-size: 1.1rem;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .link-card:hover .link-arrow {
            transform: translateX(5px);
            color: #fff;
        }

        /* Efekty podświetlania dla TikToka i YouTube */
        .link-card.tiktok:hover {
            border-color: var(--tiktok-pink);
            background: rgba(255, 0, 80, 0.08);
            box-shadow: 0 0 30px rgba(255, 0, 80, 0.35);
        }

        .link-card.youtube:hover {
            border-color: var(--youtube-red);
            background: rgba(255, 0, 0, 0.08);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.35);
        }

        /* Karta Discord w oryginalnych barwach z nickiem __komornik */
        .discord-box {
            background: rgba(88, 101, 242, 0.06);
            border: 1px solid rgba(88, 101, 242, 0.35);
            border-radius: 18px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.3s ease;
            position: relative;
        }

        .discord-box:hover {
            border-color: var(--discord-blurple);
            box-shadow: 0 0 35px var(--discord-glow);
            background: rgba(88, 101, 242, 0.12);
        }

        .discord-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .discord-info-grp {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .discord-logo {
            width: 40px;
            height: 40px;
            background: var(--discord-blurple);
            color: white;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
            box-shadow: 0 0 15px var(--discord-glow);
        }

        .discord-user-text {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            text-align: left;
        }

        .discord-role {
            font-size: 0.82rem;
            color: #8ab4f8;
            text-align: left;
        }

        .discord-badge-soon {
            background: rgba(88, 101, 242, 0.25);
            color: #c9d1d9;
            border: 1px solid var(--discord-blurple);
            padding: 5px 11px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .copy-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.25);
            padding: 10px;
            border-radius: 10px;
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .copy-btn:hover {
            background: var(--discord-blurple);
            color: white;
            border-color: transparent;
            box-shadow: 0 0 20px var(--discord-glow);
        }

        /* Stopka */
        .footer-info {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .system-live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .green-dot {
            width: 7px;
            height: 7px;
            background: #23a55a;
            border-radius: 50%;
            box-shadow: 0 0 10px #23a55a;
        }

        /* Toast powiadomienie schowka */
        #toast-alert {
            position: fixed;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: #ffffff;
            color: #000;
            padding: 12px 26px;
            border-radius: 35px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
            pointer-events: none;
        }

        #toast-alert.active {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- Animowane cząsteczki tła Canvas -->
    <canvas id="liveCanvas"></canvas>
    <div class="cyber-grid"></div>

    <div class="hub-container">
        <!-- Awatar ze zdjęciem miecza -->
        <div class="avatar-box">
            <div class="avatar-ring"></div>
            <div class="avatar-photo"></div>
            <div class="online-status"></div>
        </div>

        <!-- Nagłówek -->
        <div>
            <h1 class="name-title">KOMORNIK</h1>
            <div class="tag-badge">
                <span>⚡ ELITE GAMER HUB</span>
            </div>
        </div>

        <!-- Opis użytkownika -->
        <div class="bio-box">
            Hi, i'm <span>Komornik</span>, im from <span>Poland</span>. Play <span>CF</span> & <span>TWW</span>! 🎮🔥
        </div>

        <!-- Lista odnośników -->
        <div class="links-stack">
            
            <!-- TikTok -->
            <a href="https://www.tiktok.com/@__komornik?_r=1&_t=ZN-9AuufJQdPE6" target="_blank" class="link-card tiktok">
                <div class="link-left">
                    <div class="link-icon">🎬</div>
                    <span>TikTok</span>
                </div>
                <div class="link-arrow">→</div>
            </a>

            <!-- YouTube -->
            <a href="https://youtube.com/@komornik_2022" target="_blank" class="link-card youtube">
                <div class="link-left">
                    <div class="link-icon">🎥</div>
                    <span>YouTube</span>
                </div>
                <div class="link-arrow">→</div>
            </a>

            <!-- Discord w barwach Discorda z nickiem __komornik -->
            <div class="discord-box">
                <div class="discord-top">
                    <div class="discord-info-grp">
                        <div class="discord-logo">💬</div>
                        <div>
                            <div class="discord-user-text">__komornik</div>
                            <div class="discord-role">Serwer Discord wkrótce</div>
                        </div>
                    </div>
                    <span class="discord-badge-soon">Wkrótce</span>
                </div>
                <button class="copy-btn" onclick="copyDiscordTag()">Skopiuj nick: __komornik</button>
            </div>

        </div>

        <!-- Stopka -->
        <div class="footer-info">
            <div class="system-live">
                <span class="green-dot"></span>
                <span>SYSTEM ACTIVE</span>
            </div>
            <span>PRO v3.0</span>
        </div>
    </div>

    <!-- Powiadomienie Toast -->
    <div id="toast-alert">Skopiowano nick: __komornik! 📋</div>

    <script>
        /* ==========================================================================
           SILNIK ANIMACJI TŁA (INTERAKTYWNE CANVAS)
           ========================================================================== */
        const canvas = document.getElementById('liveCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const particleCount = 65;

        function resizeWindow() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeWindow);
        resizeWindow();

        class Spark {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.6;
                this.speedX = (Math.random() - 0.5) * 0.7;
                this.speedY = (Math.random() - 0.5) * 0.7;
                this.alpha = Math.random() * 0.8 + 0.2;
            }

            move() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            render() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function setupParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Spark());
            }
        }

        function runAnimationLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].move();
                particles[i].render();

                // Łączenie cząsteczek siatką neonową dla efektu życia strony
                for (let j = i; j < particles.length; j++) {
                    let dx = particles[i].x - particles.z ? 0 : particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 120) {
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.07 * (1 - dist / 120)})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(runAnimationLoop);
        }

        setupParticles();
        runAnimationLoop();

        // Kopiowanie nicku ze schowka z animacją
        function copyDiscordTag() {
            navigator.clipboard.writeText('__komornik').then(() => {
                const toast = document.getElementById('toast-alert');
                toast.classList.add('active');
                setTimeout(() => {
                    toast.classList.remove('active');
                }, 2600);
            }).catch(err => {
                console.error('Błąd schowka:', err);
            });
        }
    </script>
</body>
</html>
